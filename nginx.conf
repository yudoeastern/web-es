# Redirect all HTTP traffic from IP to domain
server {
    listen 80;
    listen [::]:80;
    server_name 8.215.103.151 _;

    # Redirect all requests to the main domain
    return 301 https://www.easternstack.com$request_uri;
}

# HTTP server block for easternstack.com and easternstack.ai - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name easternstack.com www.easternstack.com easternstack.ai www.easternstack.ai;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# Main HTTPS server block for easternstack.com and easternstack.ai
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name easternstack.com www.easternstack.com easternstack.ai www.easternstack.ai;

    # SSL certificates for both .com and .ai domains
    ssl_certificate /etc/letsencrypt/live/easternstack.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easternstack.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow image uploads up to the app's own 5MB limit (default is 1MB)
    client_max_body_size 10m;

    # Serve uploaded webinar images directly from disk so new uploads are
    # available immediately, without needing a Next.js restart/rebuild.
    # Only matches actual image files -- /events/<id> (the event detail
    # page) must still fall through to the Next.js proxy below.
    location ~ ^/events/(.+\.(?:png|jpe?g|webp|gif))$ {
        alias /root/apps/web/public/events/$1;
        access_log off;
        expires 30d;
    }

    # Proxy all requests to Next.js app
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTP server block for trial.easternstack.com - Trial Platform frontend
# (certbot will add the HTTPS server block + redirect automatically once run)
server {
    server_name trial.easternstack.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/trial.easternstack.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trial.easternstack.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = trial.easternstack.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name trial.easternstack.com;
    return 404; # managed by Certbot


}

