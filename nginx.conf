# Redirect all HTTP traffic from IP to the canonical domain
server {
    listen 80;
    listen [::]:80;
    server_name 8.215.103.151 _;

    # Redirect all requests to the canonical domain
    return 301 https://easternstack.ai$request_uri;
}

# HTTP: redirect all to https apex .ai
server {
    listen 80;
    listen [::]:80;
    server_name easternstack.ai www.easternstack.ai easternstack.com www.easternstack.com;

    return 301 https://easternstack.ai$request_uri;
}

# HTTPS: www -> apex .ai redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.easternstack.ai www.easternstack.com;

    ssl_certificate /etc/letsencrypt/live/easternstack.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easternstack.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://easternstack.ai$request_uri;
}

# Main HTTPS server block: both apex domains serve the app
# (canonical tags in the app point to easternstack.ai so SEO stays consolidated)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name easternstack.ai easternstack.com;

    # SSL certificates for both .com and .ai domains
    ssl_certificate /etc/letsencrypt/live/easternstack.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easternstack.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow image uploads up to the app's own 5MB limit (default is 1MB)
    client_max_body_size 10m;

    # Serve uploaded webinar images directly from disk
    # This prevents Next.js dynamic route from trying to render image files
    location ~* ^/events/(webinar-.+\.(?:png|jpe?g|webp|gif|jpeg))$ {
        root /root/apps/web/public;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all requests to Next.js app
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

